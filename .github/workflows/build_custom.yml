name: Build YTLite Custom IPA

on:
  workflow_dispatch:
    inputs:
      ipa_url:
        description: "URL to the decrypted YouTube IPA"
        required: true
        type: string

      tweak_version:
        description: "YTLite version tag from releases (e.g. 5.2.1)"
        default: "5.2.1"
        required: true
        type: string

      display_name:
        description: "App display name"
        default: "YouTube"
        required: true
        type: string

      bundle_id:
        description: "App Bundle ID"
        default: "com.google.ios.youtube"
        required: true
        type: string

      enable_youpip:
        description: "Integrate YouPiP (Picture in Picture)"
        type: boolean
        required: true
        default: false

      enable_ytuhd:
        description: "Integrate YTUHD (4K/HDR)"
        type: boolean
        required: true
        default: false

      enable_yq:
        description: "Integrate YouQuality"
        type: boolean
        required: true
        default: false

      enable_ryd:
        description: "Integrate Return YouTube Dislikes"
        type: boolean
        required: true
        default: false

      enable_ytabc:
        description: "Integrate YTABConfig"
        type: boolean
        required: true
        default: false

      enable_demc:
        description: "Integrate DontEatMyContent"
        type: boolean
        required: true
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-custom-tweak:
    name: Build Custom YTLite (.deb)
    runs-on: macos-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: brew install make ldid dpkg

      - name: Set PATH
        run: |
          echo "$(brew --prefix make)/libexec/gnubin" >> $GITHUB_PATH
          echo "THEOS=${{ github.workspace }}/theos" >> $GITHUB_ENV

      - name: Cache Theos
        id: theos
        uses: actions/cache@v4
        env:
          cache-name: theos_cache_9bc7340
        with:
          path: theos/
          key: ${{ env.cache-name }}
          restore-keys: ${{ env.cache-name }}

      - name: Setup Theos
        if: steps.theos.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          repository: theos/theos
          ref: 9bc73406cf80b711ef4d02c15ff1dedc4478a275
          path: theos
          submodules: recursive

      - name: Download iOS SDK
        if: steps.theos.outputs.cache-hit != 'true'
        run: |
          git clone --quiet -n --depth=1 --filter=tree:0 https://github.com/theos/sdks/
          cd sdks
          git sparse-checkout set --no-cone iPhoneOS16.5.sdk
          git checkout
          mv *.sdk $THEOS/sdks

      - name: Build Custom YTLite Tweak
        run: |
          make clean package DEBUG=0 FINALPACKAGE=1
          mv packages/*.deb custom-ytlite.deb

      - name: Download optional tweaks
        run: |
          # --- Optional extra tweaks (from original workflow) ---
          if [ "${{ inputs.enable_youpip }}" = "true" ] || \
             [ "${{ inputs.enable_ytuhd }}" = "true" ] || \
             [ "${{ inputs.enable_yq }}" = "true" ] || \
             [ "${{ inputs.enable_ryd }}" = "true" ] || \
             [ "${{ inputs.enable_ytabc }}" = "true" ] || \
             [ "${{ inputs.enable_demc }}" = "true" ]; then

            cd $THEOS/include
            if [ -d "YouTubeHeader" ]; then
              cd YouTubeHeader && git pull && cd ..
            else
              git clone --quiet --depth=1 https://github.com/PoomSmart/YouTubeHeader.git
            fi

            if [ "${{ inputs.enable_demc }}" = "true" ]; then
              rm -rf YTHeaders
              cp -r YouTubeHeader YTHeaders
            fi

            if [ -d "PSHeader" ]; then
              cd PSHeader && git pull && cd ..
            else
              git clone --quiet --depth=1 https://github.com/PoomSmart/PSHeader.git
            fi

            cd ${{ github.workspace }}

            git clone --quiet --depth=1 https://github.com/PoomSmart/YouGroupSettings.git
            cd YouGroupSettings && make clean package DEBUG=0 FINALPACKAGE=1 && mv packages/*.deb ../ygs.deb && cd ..
          fi

          if [ "${{ inputs.enable_youpip }}" = "true" ]; then
            git clone --quiet --depth=1 https://github.com/PoomSmart/YouPiP.git
            git clone --quiet --depth=1 https://github.com/PoomSmart/YTVideoOverlay.git
            cd YouPiP && make clean package DEBUG=0 FINALPACKAGE=1 && mv packages/*.deb ../youpip.deb && cd ..
            cd YTVideoOverlay && make clean package DEBUG=0 FINALPACKAGE=1 && mv packages/*.deb ../ytvo.deb && cd ..
          fi

          if [ "${{ inputs.enable_ytuhd }}" = "true" ]; then
            git clone --quiet --depth=1 https://github.com/Tonwalter888/YTUHD.git
            cd YTUHD && make clean package DEBUG=0 FINALPACKAGE=1 && mv packages/*.deb ../ytuhd.deb && cd ..
          fi

          if [ "${{ inputs.enable_yq }}" = "true" ]; then
            git clone --quiet --depth=1 https://github.com/PoomSmart/YouQuality.git
            cd YouQuality && make clean package DEBUG=0 FINALPACKAGE=1 && mv packages/*.deb ../yq.deb && cd ..
          fi

          if [ "${{ inputs.enable_ryd }}" = "true" ]; then
            git clone --quiet --depth=1 https://github.com/PoomSmart/Return-YouTube-Dislikes.git
            cd Return-YouTube-Dislikes && make clean package DEBUG=0 FINALPACKAGE=1 && mv packages/*.deb ../ryd.deb && cd ..
          fi

          if [ "${{ inputs.enable_ytabc }}" = "true" ]; then
            git clone --quiet --depth=1 https://github.com/PoomSmart/YTABConfig.git
            cd YTABConfig && make clean package DEBUG=0 FINALPACKAGE=1 && mv packages/*.deb ../ytabc.deb && cd ..
          fi

          if [ "${{ inputs.enable_demc }}" = "true" ]; then
            git clone --quiet --depth=1 https://github.com/therealFoxster/DontEatMyContent.git
            cd DontEatMyContent && make clean package DEBUG=0 FINALPACKAGE=1 && mv packages/*.deb ../demc.deb && cd ..
          fi

      - name: Clone Open in YouTube Safari Extension
        run: |
          git clone --quiet -n --depth=1 --filter=tree:0 https://github.com/BillyCurtis/OpenYouTubeSafariExtension
          cd OpenYoutubeSafariExtension
          git sparse-checkout set --no-cone OpenYoutubeSafariExtension.appex
          git checkout
          mv *.appex ..

      - name: Download and validate IPA
        run: |
          wget "${{ github.event.inputs.ipa_url }}" --no-verbose -O youtube.ipa
          file_type=$(file --mime-type -b youtube.ipa)
          if [[ "$file_type" != "application/x-ios-app" && "$file_type" != "application/zip" ]]; then
            echo "::error::Not a valid IPA. Detected: $file_type"
            exit 1
          fi

      - name: Install cyan (IPA injector)
        run: pipx install --force https://github.com/asdfzxcvbn/pyzule-rw/archive/main.zip

      - name: Inject tweaks into IPA
        run: |
          tweaks="custom-ytlite.deb OpenYoutubeSafariExtension.appex"
          for f in *.deb; do
            [ -f "$f" ] && [ "$f" != "custom-ytlite.deb" ] && tweaks="$tweaks $f"
          done
          cyan -i youtube.ipa -o YTLiteCustom_${{ github.event.inputs.tweak_version }}.ipa -uwef $tweaks \
            -n "${{ github.event.inputs.display_name }}" \
            -b "${{ github.event.inputs.bundle_id }}"

      - name: Upload IPA to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ytlite-custom-${{ github.run_number }}
          name: "YTLite Custom v${{ github.event.inputs.tweak_version }} (Build ${{ github.run_number }})"
          body: |
            ## YTLite Custom Build
            - ✅ כל הטוויקים של YTLite
            - ✅ מהירות ניגון עד 10×
            - ✅ בנייה אוטומטית ב-GitHub Actions
          files: YTLiteCustom_${{ github.event.inputs.tweak_version }}.ipa
          draft: true

      - name: Output Release URL
        run: echo "::notice::Release at https://github.com/${{ github.repository }}/releases"
